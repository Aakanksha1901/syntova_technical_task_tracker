
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: car_showroom_db
      MYSQL_USER: showroom_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-showroom_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u showroom_user -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: car_showroom_db
      DB_USER: showroom_user
      DB_PASSWORD: ${DB_PASSWORD:-showroom_password}
      CAR_DATA_PATH: data/car_dataset_india.csv
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
